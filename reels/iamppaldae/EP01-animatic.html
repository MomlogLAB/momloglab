<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>아이엠빨대 EP.1 애니매틱</title>
<style>
:root{--bg:#111;--card:#2A2A2E;--card2:#34343A;--straw:#FF5A5F;--cup:#F3E9DC;--txt:#fff;--dim:#A6A6AE}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg)}
body{display:flex;align-items:center;justify-content:center;font-family:'Pretendard','Noto Sans KR',sans-serif}
#wrap{position:relative;width:min(100vw,calc(100vh*9/16));aspect-ratio:9/16;overflow:hidden}
#stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;background:#000;overflow:hidden}
.cut{position:absolute;inset:0;opacity:0;background:linear-gradient(160deg,var(--card) 0%,var(--card2) 100%)}
.tag{position:absolute;left:60px;top:90px;background:var(--straw);color:#fff;font-size:40px;font-weight:900;padding:12px 28px;border-radius:16px}
.time{position:absolute;right:60px;top:100px;color:var(--dim);font-size:36px;font-weight:700}
.desc{position:absolute;left:80px;right:80px;top:620px;text-align:center;color:var(--dim);font-size:52px;font-weight:700;line-height:1.45}
.desc b{display:block;color:#fff;font-size:64px;font-weight:900;margin-bottom:18px}
.cupico{position:absolute;width:150px;height:230px}
.cupico .s{position:absolute;left:84px;top:0;width:16px;height:110px;background:var(--straw);border-radius:8px;transform:rotate(12deg)}
.cupico .l{position:absolute;left:0;top:60px;width:150px;height:22px;background:#ddd;border-radius:11px}
.cupico .b{position:absolute;left:10px;top:76px;width:130px;height:150px;background:var(--cup);border-radius:0 0 30px 30px;opacity:.9}
.sub{position:absolute;left:60px;right:60px;top:1260px;text-align:center;color:#fff;font-size:68px;font-weight:900;line-height:1.35;
  text-shadow:0 0 10px #000,0 0 4px #000,3px 3px 0 #000,-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000;opacity:0}
.hook{position:absolute;left:50px;right:50px;top:260px;text-align:center;background:#fff;color:#111;font-size:80px;font-weight:900;line-height:1.25;padding:36px 20px;border-radius:30px;opacity:0}
.hook em{font-style:normal;color:var(--straw)}
.end{position:absolute;left:60px;right:60px;top:1500px;text-align:center;opacity:0}
.end span{display:inline-block;background:var(--straw);color:#fff;font-size:58px;font-weight:900;padding:26px 46px;border-radius:70px}
#prog{position:absolute;left:0;top:0;height:10px;background:var(--straw);z-index:5}
#ctrl{position:fixed;right:16px;bottom:16px;z-index:9;display:flex;gap:8px}
#ctrl button{font:700 14px 'Noto Sans KR',sans-serif;padding:10px 14px;border-radius:10px;border:0;background:#fff;color:#111;cursor:pointer}
body.render #ctrl{display:none}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div id="prog"></div>
  <div id="cuts"></div>
  <div class="hook" id="hook">저 남편 월급에<br><em>빨대 꽂고</em> 삽니다</div>
  <div id="subs"></div>
  <div class="end" id="end"><span>팔로우 = 같이 빨대 꽂기 🥤</span></div>
</div></div>
<div id="ctrl"><button id="play">⏯ 재생/정지</button><button id="restart">↺ 처음부터</button></div>

<script>
const DURATION = 23;
// [시작, 끝, 컷번호, 컷 제목, 설명, 컵 위치 x, y]
const CUTS = [
  [0.0, 1.8, 1, '빨대 꽂기 클로즈업', '아이스 컵에 빨대 "푹"<br>소리 살리기', 465, 980],
  [1.8, 4.0, 2, '쭉 마시는 옆모습', '컵 든 손 + 턱선까지', 700, 900],
  [4.0, 6.6, 3, '거실 걷는 뒷모습', '컵 들고 여유로운 척 슬로 걸음', 200, 950],
  [6.6, 9.0, 4, '남편 컵에 슬쩍', '남편 컵에 빨대 꽂아 마시는 손<br>남편 손 프레임 인', 760, 960],
  [9.0, 10.6, 5, '아이 손 잡고 걷기', '아이 얼굴 X · 손/발만<br>내 손에 빨대 컵', 120, 980],
  [10.6, 11.8, 6, '집밥 만드는 손', '조리대 구석에 빨대 컵', 820, 1000],
  [11.8, 13.0, 7, '빨래 개는 손', '빨래 더미 옆 빨대 컵', 110, 1000],
  [13.0, 14.2, 8, '필라테스', '다리/뒷모습 · 매트 옆 텀블러', 820, 1000],
  [14.2, 17.0, 9, '소파 털썩 → 벌떡', '빨대 무는 순간 아이 부르는 소리<br>→ 벌떡 일어남', 465, 980],
  [17.0, 23.01, 10, '건배 엔딩', '컵을 카메라 쪽으로 내밀기<br>빨대가 화면 정중앙', 465, 980],
];
const SUBS = [
  [1.8, 4.0, '안녕하세요, 빨대예요.'],
  [4.0, 6.6, '네, 그 빨대.<br>남편 월급에 꽂혀 있는 그 빨대요.'],
  [6.6, 9.0, '특기는 스리슬쩍 빨대 꽂기.'],
  [9.0, 10.6, '근데 빨대 꽂은 채로<br>할 건 다 해요.'],
  [10.6, 11.8, '육아,'],
  [11.8, 13.0, '육아, 집밥, 빨래,'],
  [13.0, 14.2, '육아, 집밥, 빨래,<br>필라테스까지.'],
  [14.2, 17.0, '…이거 생각보다 바빠요.'],
  [17.0, 20.6, '꿈이요? 왕빨대 돼서,<br>나도 빨대 한번 꽂혀보기.'],
  [20.6, 23.01, '그때까진… 쭉—'],
];
const cutsEl = document.getElementById('cuts'), subsEl = document.getElementById('subs');
const fmt = s => s.toFixed(1);
for (const [s,e,n,t,d,x,y] of CUTS){
  const el = document.createElement('div'); el.className='cut';
  el.innerHTML = `<div class="tag">CUT ${n}</div><div class="time">${fmt(s)}s – ${fmt(Math.min(e,DURATION))}s</div>
    <div class="desc"><b>${t}</b>${d}</div>
    <div class="cupico" style="left:${x}px;top:${y}px"><div class="s"></div><div class="l"></div><div class="b"></div></div>`;
  el.dataset.s=s; el.dataset.e=e; cutsEl.appendChild(el);
}
for (const [s,e,t] of SUBS){
  const el = document.createElement('div'); el.className='sub'; el.innerHTML=t;
  el.dataset.s=s; el.dataset.e=e; subsEl.appendChild(el);
}
const stage = document.getElementById('stage'), wrap = document.getElementById('wrap');
function fit(){ stage.style.transform = `scale(${wrap.clientWidth/1080})`; }
addEventListener('resize', fit); fit();
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const on = (el,t,f=0.12)=>{ const s=+el.dataset.s,e=+el.dataset.e; return (t>=s&&t<e)?Math.min(clamp((t-s)/f),clamp((e-t)/f)):0; };

function render(t){
  document.getElementById('prog').style.width=(t/DURATION*100)+'%';
  for (const el of cutsEl.children){ const o=on(el,t,0.08); el.style.opacity=o;
    const s=+el.dataset.s,e=+el.dataset.e; // 컷마다 느린 줌인(켄번스)
    el.style.transform=`scale(${1+0.04*clamp((t-s)/(e-s))})`; }
  for (const el of subsEl.children){ el.style.opacity = (t>=+el.dataset.s && t<+el.dataset.e)?1:0; }
  // 훅: 0~1.8초, 팝 인
  const hp=clamp(t/0.25), hook=document.getElementById('hook');
  hook.style.opacity = t<1.8 ? hp : 0;
  hook.style.transform=`scale(${0.85+0.15*hp})`;
  const ep=clamp((t-20.8)/0.3), end=document.getElementById('end');
  end.style.opacity=ep; end.style.transform=`translateY(${(1-ep)*40}px)`;
}
window.render=render; window.DURATION=DURATION;
if (!location.search.includes('render')){
  let start=performance.now(), paused=false, pausedAt=0;
  const loop=now=>{ if(!paused) render(((now-start)/1000)%DURATION); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
  document.getElementById('play').onclick=()=>{ if(paused){start=performance.now()-pausedAt*1000;paused=false;} else {pausedAt=((performance.now()-start)/1000)%DURATION;paused=true;} };
  document.getElementById('restart').onclick=()=>{start=performance.now();paused=false;};
} else { document.body.classList.add('render'); render(0); }
</script>
</body>
</html>
